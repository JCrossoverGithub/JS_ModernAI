services:
  # --- Qdrant vector database (replaces ChromaDB) ---
  qdrant:
    image: qdrant/qdrant:v1.12.0
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # --- MongoDB data warehouse ---
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=llm_twin
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped

  # --- React Frontend (nginx in prod, dev server in dev) ---
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # --- .NET Backend (API Gateway + Auth + SignalR) ---
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/data/app.db
      - Jwt__Key=Q7mX2pL9vNc4Rk8sT1dF6jHb3WyZu5AeG0qVrM2nCx7Kp9LtSd4Jf8hBw1YzE6uN
      - Jwt__Issuer=LibraryAI
      - Jwt__Audience=LibraryAI-Client
      - Jwt__ExpirationMinutes=1440
      - PythonAI__BaseUrl=http://ai-service:8100
      - AllowedOrigins=http://localhost:3000,http://localhost:5173
    volumes:
      - backend-data:/data
    depends_on:
      - ai-service

  # --- Python AI Service (FastAPI + LangChain + Ollama client) ---
  ai-service:
    build: ./ai-service
    ports:
      - "8100:8100"
    environment:
      # Legacy (Phase 1 — removed in Phase 3)
      - CHROMA_DIR=/data/chroma_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Serving
      - CORS_ORIGIN=http://backend:5000
      - UPLOAD_DIR=/data/uploads
      - EMBED_DEVICE=cuda             # RTX 3070 Ti — set to 'cpu' if no GPU
      - HF_HOME=/data/hf_cache
      # Qdrant (Phase 3+)
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # MongoDB (Phase 2+)
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=llm_twin
      # HuggingFace (Phase 4+)
      - HUGGINGFACE_ACCESS_TOKEN=${HUGGINGFACE_ACCESS_TOKEN:-}
      # Inference mode: ollama | huggingface | sagemaker
      - INFERENCE_MODE=ollama
    volumes:
      - ai-data:/data
    depends_on:
      - qdrant
      - mongodb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  backend-data:
  ai-data:
  qdrant-data:
  mongodb-data:
